    let currentIdx = 0;

    function switchTemplate(idx) {
      currentIdx = idx;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
      const t = TEMPLATES[idx];
      document.getElementById('meta-subject').textContent = t.subject;
      document.getElementById('meta-to').textContent = t.to;
      document.getElementById('meta-trigger').textContent = t.trigger;

      const frame = document.getElementById('preview-frame');
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(t.html);
      doc.close();
    }

    function setDevice(device) {
      const wrapper = document.getElementById('frame-wrapper');
      const isMobile = device === 'mobile';
      wrapper.classList.toggle('mobile', isMobile);
      document.getElementById('btn-desktop').classList.toggle('active', !isMobile);
      document.getElementById('btn-mobile').classList.toggle('active', isMobile);
    }

    // Initialize with first template
    switchTemplate(0);
